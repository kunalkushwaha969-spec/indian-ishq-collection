    <script>
      // Prevent unhandled WebSocket rejections from breaking the UI in sandboxed environments
      window.addEventListener('unhandledrejection', function(e) {
        var reason = (e && e.reason && (e.reason.message || e.reason.toString())) || '';
        if (typeof reason === 'string' && (reason.indexOf('WebSocket') !== -1 || reason.indexOf('closed without opened') !== -1)) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function(e) {
        var msg = (e && (e.message || '')) || '';
        if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1)) {
          e.preventDefault();
        }
      });
    </script>
